# Superposicion de PRODUCCION — se aplica ENCIMA de docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ES UNA SUPERPOSICION Y NO UN ARCHIVO APARTE, a proposito. Dos compose completos
# divergen: alguien cambia una variable de entorno en uno y no en el otro, y
# produccion deja de ser lo que se probo. Aqui solo esta LA DIFERENCIA, y se lee
# entera de un vistazo:
#
#   1. Caddy delante, con TLS automatico
#   2. Limites de memoria: la base y la API comparten maquina (ADR-016)
#   3. Archivado de WAL, para tener PITR y no perder hasta 24 h entre volcados
#
# LO QUE NO ESTA AQUI Y CONVIENE SABER: los puertos publicados ya estan atados a
# 127.0.0.1 en el archivo base. Compose CONCATENA la lista de `ports` al
# superponer, asi que no se pueden quitar desde aqui — y por eso la restriccion
# vive en el archivo base, donde ademas protege tambien a la maquina de
# desarrollo.

name: costeo-saas

services:
  db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200
      - -c
      - pg_stat_statements.track=all
      # --- Archivado de WAL: lo que convierte el respaldo diario en PITR ------
      #
      # Sin esto, la ventana de perdida es de hasta 24 horas: lo que haya
      # entrado desde el ultimo `pg_dump`. Con esto, se puede recuperar hasta un
      # instante concreto.
      #
      # `archive_command` copia a un directorio montado; quien lo suba fuera de
      # la maquina es la tarea programada del host. **Un archivado que escribe
      # en el mismo disco que puede morir no es un archivado**, es un rodeo.
      #
      # El `test ! -f` NO es una precaucion decorativa: PostgreSQL reintenta el
      # mismo segmento si el comando falla, y sin esa comprobacion una copia a
      # medias se sobrescribiria con otra a medias.
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f
      - -c
      - wal_level=replica
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
      - walarchive:/wal
    deploy:
      resources:
        limits:
          # La base y la API comparten maquina. Sin techo, un plan de consulta
          # malo en una se lleva por delante a la otra.
          memory: 2G

  pgbouncer:
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      LOG_LEVEL: info
      # El limitador de peticiones vive en memoria del proceso. Con UNA replica
      # el limite es exacto; el dia que haya dos, esto pasa a Redis o el limite
      # real se multiplica por el numero de replicas sin que nadie lo note.
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX: '300'
    deploy:
      resources:
        limits:
          memory: 768M

  # --- El unico servicio que mira a internet ---------------------------------
  #
  # Caddy y no nginx+certbot por una razon y es la de siempre en este proyecto:
  # es la opcion aburrida. Obtiene y renueva el certificado de Let's Encrypt
  # solo, sin cron, sin hook de recarga y sin un certificado caducado un domingo.
  # Su configuracion son cuatro lineas frente a un archivo de nginx que hay que
  # entender para tocar.
  #
  # IMAGEN FIJADA POR DIGEST, como todas (CLAUDE.md §1, regla
  # `sin-imagen-sin-fijar` de audit:forbidden).
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: costeo-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO}
      # Let's Encrypt avisa a esta direccion si el certificado va a caducar y la
      # renovacion automatica no esta funcionando. Es el aviso que llega ANTES
      # de que el sitio deje de cargar.
      CORREO_TLS: ${CORREO_TLS:?falta CORREO_TLS}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
    name: costeo-pgdata
  # Los segmentos de WAL a la espera de que la tarea programada los suba fuera.
  walarchive:
    name: costeo-wal
  # Aqui viven los certificados. **Perder este volumen significa volver a
  # pedirlos**, y Let's Encrypt limita cuantas veces por semana se puede.
  caddydata:
    name: costeo-caddy-data
  caddyconfig:
    name: costeo-caddy-config
